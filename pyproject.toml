[tool.uv]
# UVの設定

[project]
name = "web-archive"
version = "0.1.0"
description = "A personal web archive tool to save and view web content"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "fastapi==0.92.0",
    "uvicorn==0.20.0",
    "requests==2.28.2",
    "beautifulsoup4==4.11.2",
    "Pillow==9.4.0",
    "pytest==7.2.1",
    "pytest-asyncio==0.20.3",
    "httpx==0.23.3",
    "playwright==1.40.0", # Add playwright
    "sse-starlette==1.6.5", # Add sse-starlette
]

[project.optional-dependencies]
dev = [
    "black==23.1.0",
    "isort==5.12.0",
]
